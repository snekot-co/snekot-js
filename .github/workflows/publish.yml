# Publishes @snekot/sdk to npm when a release is published here. npm trusts this workflow by name (trusted
# publishing), so there is no token to store or rotate.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.1
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships with.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: The release tag must be the version in package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "$(node -p "require('./package.json').version")"
      # prepublishOnly runs the tests and the build first.
      - run: npm publish --access public
